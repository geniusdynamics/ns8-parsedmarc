#
# Restic backup of ns8-parsedmarc
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
#
# - settings.json: every setting (no secrets)
# - secrets/: 0600 secrets (passwords, tokens, API keys)
# - certs/: private CA and certificates of the bundled OpenSearch
# - parsedmarc-extra.ini: CLI-only parsedmarc sections, if any
# - opensearch-snapshots: consistent snapshot of the report indices, made
#   by module-dump-state. The live opensearch-data volume is not saved.
# - parsedmarc-data: attempts files and mailbox API tokens
# - grafana-data: Grafana users and dashboard edits
#
state/settings.json
state/secrets
state/certs
state/parsedmarc-extra.ini
volumes/opensearch-snapshots
volumes/parsedmarc-data
volumes/grafana-data
